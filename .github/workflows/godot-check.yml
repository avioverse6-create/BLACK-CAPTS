name: Godot project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.4.1
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -o godot.zip
          unzip godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64

      - name: Import project and parse scripts
        run: godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Run main scene briefly
        run: godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --quit-after 5
